name: Build and Release

on:
  workflow_call:
    inputs:
      name:
        description: "Name of the Zhiva app"
        required: true
        type: string
      icon:
        description: "Optional path to .ico file"
        required: false
        type: string
      release_tag:
        description: "Release tag to upload EXE (default: latest)"
        required: false
        type: string
      file_name:
        description: "Optional output EXE filename (without .exe extension)"
        required: false
        type: string

  workflow_dispatch:
    inputs:
      name:
        description: name
        required: true
        type: string
      icon:
        description: icon
        required: false
        type: string
      release_tag:
        description: release_tag
        required: false
        type: string
      file_name:
        description: file_name
        required: false
        type: string

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        shell: pwsh
        env:
          ZHIVA_APP_NAME: ${{ inputs.name }}
        run: |
          cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare release
        id: prepare
        shell: pwsh
        run: |
          $AppName = "${{ inputs.name }}"
          $FileNameInput = "${{ inputs.file_name }}"
          if (-not $FileNameInput -or $FileNameInput -eq '') {
              $FileName = $AppName -replace '[^a-zA-Z0-9._\-]', '_' -replace '__+', '_' -replace '^_|_$', ''
              if ($FileName -eq '') { $FileName = 'app' }
          } else {
              $FileName = $FileNameInput
          }

          $BuiltExe = "target\x86_64-pc-windows-msvc\release\zhiva-installer.exe"
          $OutputExe = "$FileName.exe"

          if (-not (Test-Path $BuiltExe)) {
              Write-Error "Built executable not found: $BuiltExe"
              exit 1
          }

          Copy-Item $BuiltExe $OutputExe

          # Rename with custom icon if provided
          $IconInput = '${{ inputs.icon }}'
          if ($IconInput -and $IconInput -ne '') {
              # rcedit can set icon on PE executables
              $rcedit = "$env:TEMP\rcedit-x64.exe"
              Invoke-WebRequest -Uri "https://github.com/nicedoc/rcedit/releases/latest/download/rcedit-x64.exe" -OutFile $rcedit
              & $rcedit $OutputExe --set-icon $IconInput
          }

          "EXE_NAME=$OutputExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Determine release tag
        id: tag
        shell: pwsh
        run: |
          $ReleaseTag = '${{ inputs.release_tag }}'
          if (-not $ReleaseTag -or $ReleaseTag -eq '') {
              $ReleaseTag = 'latest'
          }
          "release_tag=$ReleaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: ${{ steps.tag.outputs.release_tag }}
          draft: false
          prerelease: false
          files: ${{ env.EXE_NAME }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
